    function formatCleanDate(dateVal) {
      if (!dateVal) return "";
      const clean = dateVal.trim();
      const parts = clean.split("-");
      if (parts.length === 3) {
        let year = parts[0];
        if (year.length > 4) year = year.slice(0, 4);
        const month = String(parts[1]).padStart(2, '0');
        const day = String(parts[2]).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }
      return clean;
    }

    window.changeTheme = function(colorKey) {
      const theme = themeColors[colorKey] || themeColors.orange;
      document.documentElement.style.setProperty('--primary', theme.primary);
      document.documentElement.style.setProperty('--primary-hover', theme.hover);
      document.documentElement.style.setProperty('--primary-text', theme.text);
      document.documentElement.style.setProperty('--primary-light', theme.light);
      document.documentElement.style.setProperty('--bg-color', theme.bg);
      localStorage.setItem('onlyview_theme', colorKey);
    };

    const savedTheme = localStorage.getItem('onlyview_theme') || 'orange';
    window.changeTheme(savedTheme);

    window.switchTab = function(tabName) {
      const sections = ['sectionDashboard', 'sectionList', 'sectionForm', 'sectionSettings'];
      sections.forEach(s => document.getElementById(s)?.classList.add('hidden'));

      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.remove('bg-theme', 'text-white');
        btn.classList.add('text-gray-600', 'hover:bg-gray-100');
      });

      const activeBtn = document.getElementById(`nav-${tabName}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-gray-600', 'hover:bg-gray-100');
        activeBtn.classList.add('bg-theme', 'text-white');
      }

      if (tabName === 'dashboard') {
        document.getElementById('sectionDashboard')?.classList.remove('hidden');
        renderDashboardView();
      }
      else if (tabName === 'list') document.getElementById('sectionList')?.classList.remove('hidden');
      else if (tabName === 'form') {
        document.getElementById('sectionForm')?.classList.remove('hidden');
        if (!editingId) {
          document.getElementById('applyDate').value = new Date().toISOString().slice(0, 10);
        }

      else if (tabName === 'settings') document.getElementById('sectionSettings')?.classList.remove('hidden');
    };
