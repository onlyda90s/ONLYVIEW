<script>
(function () {
  // ===== 설정: 주소에 이 글자가 들어 있으면 사이트명을 자동으로 채웁니다 =====
  var PLATFORMS = [
    ["revu.net", "레뷰"], ["reviewnote.co.kr", "리뷰노트"], ["dinnerqueen.net", "디너의여왕"],
    ["chvu.co.kr", "체험뷰"], ["mables.kr", "마블"], ["ringble.co.kr", "링블"],
    ["gangnam-review.net", "강남맛집"], ["seoulouba.co.kr", "서울오빠"],
    ["reviewplace.co.kr", "리뷰플레이스"], ["cloudreview.co.kr", "클라우드리뷰"]
  ];
  var GENERIC = /^(레뷰|리뷰노트|디너의여왕|디너퀸|체험뷰|마블|링블|강남맛집|서울오빠|리뷰플레이스|클라우드리뷰|체험단|홈|home)$/i;
  var $ = function (id) { return document.getElementById(id); };

  function detectPlatform(url) {
    var host = ""; try { host = new URL(url).hostname; } catch (e) { return ""; }
    for (var i = 0; i < PLATFORMS.length; i++) if (host.indexOf(PLATFORMS[i][0]) !== -1) return PLATFORMS[i][1];
    return "";
  }

  // ----- 페이지 가져오기 (브라우저 보안 때문에 중간 서버를 거칩니다) -----
  var PROXIES = [
    function (u) { return { url: "https://api.allorigins.win/get?url=" + encodeURIComponent(u), json: true }; },
    function (u) { return { url: "https://corsproxy.io/?" + encodeURIComponent(u), json: false }; }
  ];
  async function fetchHtml(url) {
    for (var i = 0; i < PROXIES.length; i++) {
      var p = PROXIES[i](url), ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 8000);
      try {
        var res = await fetch(p.url, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) continue;
        var html = p.json ? ((await res.json()).contents || "") : await res.text();
        if (html && html.length > 200) return html;
      } catch (e) { clearTimeout(timer); }
    }
    return "";
  }

  // ----- 정보 뽑기 -----
  function meta(doc, sel) { var el = doc.querySelector(sel); return el ? (el.getAttribute("content") || "").trim() : ""; }

  function cleanTitle(raw) {
    var t = (raw || "").replace(/\s+/g, " ").trim();
    t = t.replace(/\[[^\]]*\]|\([^)]*\)|【[^】]*】|<[^>]*>/g, " ");
    t = t.split(/\s[-|:·–—]\s/)[0];
    t = t.replace(/레뷰|리뷰노트|디너의여왕|디너퀸|체험단|모집|캠페인|리뷰어/g, " ").replace(/\s+/g, " ").trim();
    if (t.length < 2 || GENERIC.test(t)) return "";
    return t.slice(0, 40);
  }

  function findAmount(text) {
    var re = /(\d{1,3}(?:,\d{3})+|\d{4,7})\s*원|(\d{1,3})\s*만\s*원/g, m, best = null;
    while ((m = re.exec(text))) {
      var value = m[2] ? Number(m[2]) * 10000 : Number(m[1].replace(/,/g, ""));
      var before = text.slice(Math.max(0, m.index - 25), m.index);
      var after = text.slice(re.lastIndex, re.lastIndex + 8);
      if (value < 1000 || value > 2000000) continue;
      if (/포인트|원고료|적립|할인|배송비|리워드|캐시/.test(before + after)) continue;
      var strong = /^\s*(상당|상품권|이용권|체험권)/.test(after) || /제공|내역|상당|체험권|이용권/.test(before);
      if (strong) return value;          // 확실한 후보는 바로 사용
      if (!best) best = null;            // 애매한 금액은 사용하지 않음(잘못 채우는 것 방지)
    }
    return best;
  }

  function pad(n) { return String(n).padStart(2, "0"); }
  function findDeadline(text) {
    var kw = /(리뷰|포스팅|후기|콘텐츠)[^\n]{0,10}(등록|작성|제출)?\s*(기간|마감)/;
    var m = kw.exec(text); if (!m) return "";
    var seg = text.slice(m.index, m.index + 90);
    var re = /(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/g, d, last = null;
    while ((d = re.exec(seg))) last = d;          // 기간(시작~끝)이면 마지막 날짜 사용
    if (!last) return "";
    var iso = last[1] + "-" + pad(last[2]) + "-" + pad(last[3]);
    var t = new Date(iso).getTime(), now = Date.now();
    if (isNaN(t) || t < now - 30 * 864e5 || t > now + 400 * 864e5) return "";
    return iso;
  }

  function parseInfo(html, url) {
    var doc = new DOMParser().parseFromString(html, "text/html");
    var ld = ""; doc.querySelectorAll('script[type="application/ld+json"]').forEach(function (s) { ld += " " + s.textContent; });
    var title = meta(doc, 'meta[property="og:title"]') || meta(doc, 'meta[name="twitter:title"]') ||
                (doc.querySelector("title") ? doc.querySelector("title").textContent : "");
    var desc = meta(doc, 'meta[property="og:description"]') || meta(doc, 'meta[name="description"]');
    doc.querySelectorAll("script,style,noscript").forEach(function (n) { n.remove(); });
    var body = (doc.body ? doc.body.textContent : "").replace(/\s+/g, " ");
    var all = title + " " + desc + " " + body;
    return { storeName: cleanTitle(title), amount: findAmount(all), deadline: findDeadline(all), ldHint: ld.length > 0 };
  }

  // ----- 입력칸 채우기 -----
  function setField(id, value) {
    var el = $(id); if (!el || value === "" || value === null || value === undefined) return false;
    if (el.value && !el.classList.contains("auto-filled")) return false; // 직접 쓴 값은 덮어쓰지 않음
    el.value = value; el.classList.add("auto-filled");
    el.addEventListener("input", function () { el.classList.remove("auto-filled"); }, { once: true });
    return true;
  }

  function init() {
    if (window.__urlAutofillInit) return;      // 두 번 실행되는 것을 막음
    var input = $("quickUrlInput"), btn = $("parseUrlBtn");
    if (!input || !btn) return;
    window.__urlAutofillInit = true;
    var style = document.createElement("style");
    style.textContent = ".auto-filled{box-shadow:0 0 0 2px var(--primary) !important;background:var(--primary-light) !important}";
    document.head.appendChild(style);

    // 예전 버튼 동작(알림창 방식)을 없애고 새 버튼으로 교체
    var fresh = btn.cloneNode(true); btn.replaceWith(fresh); btn = fresh; btn.textContent = "다시 불러오기";

    var status = document.createElement("p");
    status.id = "urlStatus"; status.className = "text-xs text-gray-500"; status.style.minHeight = "1rem";
    status.setAttribute("role", "status");
    input.parentElement.insertAdjacentElement("afterend", status);

    var last = "", running = false, timer = null;

    async function run(force) {
      var url = input.value.trim();
      if (!/^https?:\/\/\S+\.\S+/.test(url)) { status.textContent = ""; return; }
      if (url === last && !force) return;
      if (running) return;
      last = url; running = true;
      btn.disabled = true;
      var filled = [];
      if ($("campaignUrl") && setField("campaignUrl", url)) filled.push("링크");
      var platform = detectPlatform(url);
      if (platform && setField("platformName", platform)) filled.push("사이트명");
      status.textContent = "페이지를 읽는 중…";
      try {
        var html = await fetchHtml(url);
        if (html) {
          var info = parseInfo(html, url);
          if (setField("storeName", info.storeName)) filled.push("업체명");
          if (setField("sponsoredAmount", info.amount)) filled.push("제공금액");
          if (setField("deadlineDate", info.deadline)) filled.push("마감일");
          status.textContent = filled.length > 2 || (filled.length && info.storeName)
            ? "자동 입력: " + filled.join(", ") + " — 색으로 표시된 칸은 꼭 맞는지 확인해 주세요."
            : "일부만 읽었어요 (" + (filled.join(", ") || "없음") + "). 나머지는 직접 입력해 주세요.";
        } else {
          status.textContent = "이 페이지는 자동으로 읽지 못했어요 (사이트 보안 또는 앱 방식 페이지). " +
            (filled.length ? filled.join(", ") + "만 채웠어요. " : "") + "나머지는 직접 입력해 주세요.";
        }
      } catch (e) {
        status.textContent = "불러오는 중 문제가 생겼어요. 직접 입력해 주세요.";
      }
      running = false; btn.disabled = false;
    }

    // 주소를 붙여넣거나 입력이 멈추면 바로 실행 (버튼 없이도 동작)
    input.addEventListener("paste", function () { setTimeout(function () { run(false); }, 50); });
    input.addEventListener("change", function () { run(false); });
    input.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(function () { run(false); }, 800); });
    btn.addEventListener("click", function () { run(true); });
  }

  // 기존 코드가 모두 준비된 뒤에 실행
  window.addEventListener("load", init);
})();
</script>
