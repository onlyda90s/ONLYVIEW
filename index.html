  <style>
    :root {
      --primary: #F4A261;
      --primary-hover: #E76F51;
      --primary-text: #C85A17;
      --primary-light: #FFFBF7;
      --bg-color: #FAF8F5;

      --color-status-apply: #6B7280;
      --color-status-select: #111827;
      --color-status-visit: #F4A261;
      --color-status-unsubmitted: #E63946;
      --color-status-submit: #059669;
      --color-status-delivery: #2563EB;
      --color-status-fee: #9333EA;
    }

    body { background-color: var(--bg-color) !important; transition: background-color 0.3s ease; }
    .bg-theme { background-color: var(--primary) !important; }
    .bg-theme-hover:hover { background-color: var(--primary-hover) !important; }
    .text-theme { color: var(--primary-text) !important; }
    .bg-theme-light { background-color: var(--primary-light) !important; }
    .border-theme { border-color: var(--primary) !important; }
    .ring-theme:focus { --tw-ring-color: var(--primary) !important; }

    .widget-scroll { overflow-y: auto !important; }
    .widget-scroll::-webkit-scrollbar { width: 4px; }
    .widget-scroll::-webkit-scrollbar-track { background: #F3F4F6; border-radius: 4px; }
    .widget-scroll::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }
    .widget-scroll::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }

    .status-text-apply { color: var(--color-status-apply) !important; font-weight: 700; }
    .status-text-select { color: var(--color-status-select) !important; font-weight: 700; }
    .status-text-visit { color: var(--color-status-visit) !important; font-weight: 700; }
    .status-text-unsubmitted { color: var(--color-status-unsubmitted) !important; font-weight: 700; }
    .status-text-submit { color: var(--color-status-submit) !important; font-weight: 700; }
    .status-text-delivery { color: var(--color-status-delivery) !important; font-weight: 700; }
    .status-text-fee { color: var(--color-status-fee) !important; font-weight: 700; }

    select.select-center {
      text-align: center;
      text-align-last: center;
      padding-right: 0.25rem !important;
      padding-left: 0.05rem !important;
    }

    .tab-fixed-btn {
      width: 112px !important;
      min-width: 112px !important;
      max-width: 112px !important;
      text-align: center;
    }

    .col-fixed-status     { width: 96px !important; min-width: 96px !important; }
    .col-fixed-platform   { width: 96px !important; min-width: 96px !important; }
    .col-fixed-visit      { width: 120px !important; min-width: 120px !important; }
    .col-fixed-deadline   { width: 120px !important; min-width: 120px !important; }
    .col-fixed-sponsored  { width: 120px !important; min-width: 120px !important; }
    .col-fixed-paid       { width: 120px !important; min-width: 120px !important; }
    .col-fixed-revenue    { width: 120px !important; min-width: 120px !important; }

  <script type="module">

      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfKBcYsKume9YqbZwFGtVuFvElrfVGNzY",
      authDomain: "onlyview-2ef88.firebaseapp.com",
      projectId: "onlyview-2ef88",
      storageBucket: "onlyview-2ef88.firebasestorage.app",
      messagingSenderId: "110107089396",
      appId: "1:110107089396:web:a0670b16ce10655c2481a1"
    };

    let app, auth, db, provider;

    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      provider = new GoogleAuthProvider();
    } catch (e) {
      console.error("Firebase 초기화 에러:", e);
    }

    let currentUser = null;
    let targetUserId = null;
    let isReadOnly = false;
    let rawCampaignList = [];
    let isBatchEditing = false; 
    let listSubTab = 'ongoing'; 
    let newBatchRows = []; 
    let yearlyChartInstance = null;

    let sortColumn = localStorage.getItem('onlyview_sortColumn') || 'none'; 
    let sortAsc = localStorage.getItem('onlyview_sortAsc') === 'true'; 

    let myCustomCode = "";
    let currentCalDate = new Date();
    let selectedStatus = "신청";
    let editSelectedStatus = "선정";
    let editingId = null;
    let activeColorPickerKey = null;

    let deadlineAlertDays = 7;
    let platformList = JSON.parse(localStorage.getItem('onlyview_platforms')) || ['개별', '리뷰노트', '레뷰', '디너의여왕'];

    const presetPalette = [
      '#6B7280', '#111827', '#E63946', '#F4A261', '#E9C46A',
      '#059669', '#2563EB', '#4F46E5', '#9333EA', '#D97706',
      '#EC4899', '#0891B2'
    ];

    const customStatusColors = {
      apply: '#6B7280',
      select: '#111827',
      visit: '#F4A261',
      unsubmitted: '#E63946',
      submit: '#059669',
      delivery: '#2563EB',
      fee: '#9333EA'
    };

    function applyStatusCSSColors() {
      document.documentElement.style.setProperty('--color-status-apply', customStatusColors.apply);
      document.documentElement.style.setProperty('--color-status-select', customStatusColors.select);
      document.documentElement.style.setProperty('--color-status-visit', customStatusColors.visit || '#F4A261');
      document.documentElement.style.setProperty('--color-status-unsubmitted', customStatusColors.unsubmitted || '#E63946');
      document.documentElement.style.setProperty('--color-status-submit', customStatusColors.submit);
      document.documentElement.style.setProperty('--color-status-delivery', customStatusColors.delivery);
      document.documentElement.style.setProperty('--color-status-fee', customStatusColors.fee);
    }
    applyStatusCSSColors();

    window.updateCustomStatusColor = async function(key, val) {
      if (isReadOnly) return alert("읽기 전용 모드에서는 설정을 변경할 수 없습니다.");
      customStatusColors[key] = val;
      applyStatusCSSColors();
      renderStatusColorPickers();
      filterAndRender();
      document.getElementById('colorPickerModal')?.classList.add('hidden');

      if (currentUser && !isReadOnly) {
        try {
          await setDoc(doc(db, "users", currentUser.uid), {
            statusColors: customStatusColors
          }, { merge: true });
        } catch(e) { console.error("색상 DB 저장 실패:", e); }
      }
    };

    window.openColorPickerModal = function(key, label) {
      if (isReadOnly) return alert("읽기 전용 모드에서는 설정을 변경할 수 없습니다.");
      activeColorPickerKey = key;
      const titleElem = document.getElementById('colorModalTitle');
      if (titleElem) titleElem.innerText = `${label} 상태 글자 색상 선택`;
      
      const grid = document.getElementById('colorPaletteGrid');
      if (grid) {
        grid.innerHTML = '';
        const currentColor = customStatusColors[key] || '#6B7280';

        presetPalette.forEach(hex => {
          const isSelected = currentColor.toLowerCase() === hex.toLowerCase();
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `w-10 h-10 rounded-full border-2 transition hover:scale-110 shadow-sm flex items-center justify-center ${isSelected ? 'border-gray-900 ring-2 ring-gray-400 scale-110' : 'border-white'}`;
          btn.style.backgroundColor = hex;
          if (isSelected) {
            btn.innerHTML = '<span class="text-white text-xs font-bold">✓</span>';
          }
          btn.onclick = () => updateCustomStatusColor(key, hex);
          grid.appendChild(btn);
        });
      }

      document.getElementById('colorPickerModal')?.classList.remove('hidden');
    };

    function renderStatusColorPickers() {
      const keys = [
        { id: 'apply', label: '신청' },
        { id: 'select', label: '선정' },
        { id: 'visit', label: '방문' },
        { id: 'unsubmitted', label: '미제출' },
        { id: 'submit', label: '제출' },
        { id: 'delivery', label: '배송' },
        { id: 'fee', label: '원고료' }
      ];

      keys.forEach(item => {
        const badgeElem = document.getElementById(`picker_badge_${item.id}`);
        if (badgeElem) {
          const currentColor = customStatusColors[item.id] || '#6B7280';
          badgeElem.style.backgroundColor = currentColor;
        }
      });
    }

    function formatCleanDate(dateVal) {
      if (!dateVal) return "";
      const str = String(dateVal).trim();
      if (!str) return "";
      const parts = str.split("-");
      if (parts.length === 3) {
        let year = parts[0];
        if (year.length > 4) year = year.substring(0, 4);
        const month = String(parts[1]).padStart(2, '0');
        const day = String(parts[2]).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }
      return str;
    }

        const mm = String(Number(parts[1])).padStart(2, '0');
        const dd = String(
