<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>온리뷰 (onlyview) - 대시보드</title>
  <!-- UI 스타일링 (Tailwind CSS) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 엑셀 내보내기 (SheetJS) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <style>
    :root {
      --primary: #F4A261;
      --primary-hover: #E76F51;
      --primary-text: #C85A17;
      --primary-light: #FFF2E6;
      --bg-color: #FAF8F5;
    }

    body { background-color: var(--bg-color) !important; transition: background-color 0.3s ease; }
    .bg-theme { background-color: var(--primary) !important; }
    .bg-theme-hover:hover { background-color: var(--primary-hover) !important; }
    .text-theme { color: var(--primary-text) !important; }
    .bg-theme-light { background-color: var(--primary-light) !important; }
    .border-theme { border-color: var(--primary) !important; }
    .ring-theme:focus { --tw-ring-color: var(--primary) !important; }
  </style>
</head>
<body class="text-[#333333] min-h-screen">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, getDoc, doc, setDoc, updateDoc, deleteDoc, query, where, orderBy, serverTimestamp } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfKBcYsKume9YqbZwFGtVuFvElrfVGNzY",
      authDomain: "onlyview-2ef88.firebaseapp.com",
      projectId: "onlyview-2ef88",
      storageBucket: "onlyview-2ef88.firebasestorage.app",
      messagingSenderId: "110107089396",
      appId: "1:110107089396:web:a0670b16ce10655c2481a1"
    };

    let app, auth, db, provider;

    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      provider = new GoogleAuthProvider();
    } catch (e) {
      console.error("Firebase 초기화 에러:", e);
    }

    let currentUser = null;
    let targetUserId = null;
    let isReadOnly = false;
    let rawCampaignList = [];
    let editingId = null;
    let myCustomCode = "";
    let currentCalDate = new Date();
    let selectedStatus = "신청";

    function formatCleanDate(dateVal) {
      if (!dateVal) return "";
      const clean = dateVal.trim();
      const parts = clean.split("-");
      if (parts.length === 3) {
        let year = parts[0];
        if (year.length > 4) year = year.slice(0, 4);
        const month = String(parts[1]).padStart(2, '0');
        const day = String(parts[2]).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }
      return clean;
    }

    const themeColors = {
      orange: { primary: '#F4A261', hover: '#E76F51', text: '#C85A17', light: '#FFF2E6', bg: '#FAF8F5' },
      red:    { primary: '#E63946', hover: '#D62828', text: '#D62828', light: '#FFEAEB', bg: '#FFF5F5' },
      yellow: { primary: '#E9C46A', hover: '#F4A261', text: '#B5820F', light: '#FFFBEA', bg: '#FCFBF7' },
      green:  { primary: '#2A9D8F', hover: '#218380', text: '#1B6A60', light: '#E8F6F4', bg: '#F4FBF9' },
      blue:   { primary: '#457B9D', hover: '#1D3557', text: '#1D3557', light: '#EDF4F8', bg: '#F4F8FB' },
      purple: { primary: '#9D4EDD', hover: '#7B2CBF', text: '#5A189A', light: '#F5EBFB', bg: '#FAF5FC' },
      black:  { primary: '#2B2D42', hover: '#111111', text: '#111111', light: '#EAEAEA', bg: '#F2F2F4' }
    };

    window.changeTheme = function(colorKey) {
      const theme = themeColors[colorKey] || themeColors.orange;
      document.documentElement.style.setProperty('--primary', theme.primary);
      document.documentElement.style.setProperty('--primary-hover', theme.hover);
      document.documentElement.style.setProperty('--primary-text', theme.text);
      document.documentElement.style.setProperty('--primary-light', theme.light);
      document.documentElement.style.setProperty('--bg-color', theme.bg);
      localStorage.setItem('onlyview_theme', colorKey);
    };

    const savedTheme = localStorage.getItem('onlyview_theme') || 'orange';
    window.changeTheme(savedTheme);

    window.switchTab = function(tabName) {
      const sections = ['sectionDashboard', 'sectionList', 'sectionForm', 'sectionSettings'];
      sections.forEach(s => document.getElementById(s)?.classList.add('hidden'));

      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.remove('bg-theme', 'text-white');
        btn.classList.add('text-gray-600', 'hover:bg-gray-100');
      });

      const activeBtn = document.getElementById(`nav-${tabName}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-gray-600', 'hover:bg-gray-100');
        activeBtn.classList.add('bg-theme', 'text-white');
      }

      if (tabName === 'dashboard') {
        document.getElementById('sectionDashboard')?.classList.remove('hidden');
        renderDashboardView();
      }
      else if (tabName === 'list') document.getElementById('sectionList')?.classList.remove('hidden');
      else if (tabName === 'form') {
        document.getElementById('sectionForm')?.classList.remove('hidden');
        if (!editingId) {
          document.getElementById('applyDate').value = new Date().toISOString().slice(0, 10);
        }
      }
      else if (tabName === 'settings') document.getElementById('sectionSettings')?.classList.remove('hidden');
    };

    window.setStatusBtn = function(status) {
      selectedStatus = status;
      const applyBtn = document.getElementById('btnStatusApply');
      const selectBtn = document.getElementById('btnStatusSelect');

      if (status === '신청') {
        applyBtn.className = "flex-1 py-2.5 rounded-xl font-bold border-2 border-theme bg-theme text-white text-xs transition";
        selectBtn.className = "flex-1 py-2.5 rounded-xl font-bold border-2 border-gray-200 bg-white text-gray-600 text-xs hover:border-gray-300 transition";
      } else {
        applyBtn.className = "flex-1 py-2.5 rounded-xl font-bold border-2 border-gray-200 bg-white text-gray-600 text-xs hover:border-gray-300 transition";
        selectBtn.className = "flex-1 py-2.5 rounded-xl font-bold border-2 border-theme bg-theme text-white text-xs transition";
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('loginBtn')?.addEventListener('click', async () => {
        try { await signInWithPopup(auth, provider); } 
        catch (err) { alert("로그인 오류: " + err.message); }
      });

      document.getElementById('logoutBtn')?.addEventListener('click', () => signOut(auth));
      document.getElementById('searchInput')?.addEventListener('input', filterAndRender);
      document.getElementById('filterStatus')?.addEventListener('change', filterAndRender);

      document.getElementById('prevMonthBtn')?.addEventListener('click', () => {
        currentCalDate.setMonth(currentCalDate.getMonth() - 1);
        renderDashboardView();
      });
      document.getElementById('nextMonthBtn')?.addEventListener('click', () => {
        currentCalDate.setMonth(currentCalDate.getMonth() + 1);
        renderDashboardView();
      });

      document.getElementById('closeModalBtn')?.addEventListener('click', () => {
        document.getElementById('dayModal')?.classList.add('hidden');
      });

      // 통합 원스톱 파싱 연동
      document.getElementById('parseUrlBtn')?.addEventListener('click', async () => {
        const url = document.getElementById('quickUrlInput').value.trim();
        if (!url) return alert("캠페인 URL을 입력해주세요.");
        
        document.getElementById('campaignUrl').value = url;
        
        let platform = "";
        if (url.includes("revu.net")) platform = "레뷰";
        else if (url.includes("reviewnote.co.kr")) platform = "리뷰노트";
        else if (url.includes("dinnerqueen.net")) platform = "디너퀸";
        else if (url.includes("chvu.co.kr")) platform = "체험단";
        else if (url.includes("mables.kr")) platform = "마블";
        else if (url.includes("ringble.co.kr")) platform = "링블";

        if (platform) document.getElementById('platformName').value = platform;

        const parseBtn = document.getElementById('parseUrlBtn');
        parseBtn.innerText = "분석 중...";
        parseBtn.disabled = true;

        try {
          let storeName = "";
          let sponsoredAmount = 0;
          let deadlineDate = "";

          // 1. 리뷰노트 직통 API
          if (url.includes("reviewnote.co.kr")) {
            const cidMatch = url.match(/campaigns\/([0-9a-zA-Z]+)/);
            if (cidMatch) {
              const cid = cidMatch[1];
              try {
                const apiRes = await fetch(`https://www.reviewnote.co.kr/api/v1/campaigns/${cid}`);
                if (apiRes.ok) {
                  const resJson = await apiRes.json();
                  const data = resJson.data || resJson;

                  storeName = data.title || data.storeName || data.name || "";
                  storeName = storeName.replace(/\[.*?\]|\(.*?\)/g, '').replace(/리뷰노트|모집|캠페인/g, '').split('-')[0].trim();

                  const offer = data.benefit || data.offer || data.providedService || "";
                  const manM = String(offer).match(/([0-9]+)\s*만\s*원/);
                  if (manM) {
                    sponsoredAmount = parseInt(manM[1], 10) * 10000;
                  } else {
                    const priceM = String(offer).match(/([0-9,]+)\s*원/);
                    if (priceM) sponsoredAmount = parseInt(priceM[1].replace(/,/g, ''), 10);
                  }

                  const rawEnd = data.reviewEndDate || data.endDate || data.closedAt || "";
                  if (rawEnd) deadlineDate = String(rawEnd).slice(0, 10);
                }
              } catch (err) {
                console.warn("리뷰노트 API 응답 대기 실패", err);
              }
            }
          }

          // 2. 레뷰 / 디너퀸 및 기타 사이트 다중 프록시 안전 호출
          if (!storeName) {
            let html = "";
            
            try {
              const res = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`);
              if (res.ok) html = await res.text();
            } catch (e1) {
              try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
                if (res.ok) {
                  const proxyData = await res.json();
                  html = proxyData.contents || "";
                }
              } catch (e2) {}
            }

            if (html) {
              // og:title 파싱
              const ogTitle = html.match(/<meta[^>]*property=["']og:title["'][^>]*content=["']([^"']+)["']/i) ||
                              html.match(/<title[^>]*>([^<]+)<\/title>/i);

              if (ogTitle && ogTitle[1]) {
                storeName = ogTitle[1]
                  .replace(/\[.*?\]|\(.*?\)/g, '')
                  .replace(/디너의여왕|디너퀸|레뷰|리뷰노트|체험단|모집|캠페인/g, '')
                  .split('-')[0]
                  .split('|')[0]
                  .trim();
              }

              // 금액 추출 (만원 단위 및 원 단위)
              const manM = html.match(/([0-9]+)\s*만\s*원/);
              if (manM) {
                sponsoredAmount = parseInt(manM[1], 10) * 10000;
              } else {
                const priceM = html.match(/([0-9,]+)\s*원/);
                if (priceM && priceM[1]) {
                  const pVal = parseInt(priceM[1].replace(/,/g, ''), 10);
                  if (pVal >= 1000) sponsoredAmount = pVal;
                }
              }

              // 마감일 추출
              const dateM = html.match(/(?:마감|제출|포스팅)[^0-9]*?(202[0-9][-.\/][0-1]?[0-9][-.\/][0-3]?[0-9])/i) ||
                            html.match(/202[0-9][-.\/][0-1]?[0-9][-.\/][0-3]?[0-9]/);
              if (dateM) deadlineDate = (dateM[1] || dateM[0]).replace(/[\.\/]/g, '-');
            }
          }

          // 폼 자동 채우기
          if (storeName) document.getElementById('storeName').value = storeName;
          if (sponsoredAmount > 0) document.getElementById('sponsoredAmount').value = sponsoredAmount;
          if (deadlineDate) document.getElementById('deadlineDate').value = formatCleanDate(deadlineDate);

          if (storeName || sponsoredAmount > 0 || deadlineDate) {
            alert("URL 정보가 성공적으로 추출되었습니다!");
          } else {
            alert("URL 정보를 자동으로 파싱하지 못했습니다. 매장명 및 정보를 수동으로 입력해 주세요.");
          }

        } catch (e) {
          console.error("파싱 오류:", e);
          alert("URL 정보를 불러오는 중 오류가
