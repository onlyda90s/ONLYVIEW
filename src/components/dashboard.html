<div class="flex items-center justify-between shrink-0">
  <div>
    <h2 id="dashMonthTitle" class="text-2xl md:text-3xl font-black text-theme">2026년 10월</h2>
  </div>
  <div class="flex items-center gap-2">
    <button id="dashRegisterBtn" class="bg-theme bg-theme-hover text-white text-xs px-3 py-1.5 rounded-xl font-bold shadow-sm transition">
      + 체험 등록
    </button>
    <div class="flex gap-1">
      <button id="prevMonthBtn" class="bg-white border text-gray-600 text-xs px-2.5 py-1.5 rounded-xl font-bold hover:bg-gray-50">이전달</button>
      <button id="nextMonthBtn" class="bg-white border text-gray-600 text-xs px-2.5 py-1.5 rounded-xl font-bold hover:bg-gray-50">다음달</button>
    </div>
  </div>
</div>

<div class="grid grid-cols-2 md:grid-cols-5 gap-2.5 shrink-0">
  <div id="cntBoxSelect" class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm text-center cursor-pointer hover:border-theme transition">
    <div class="text-[11px] text-gray-900 font-bold">선정 현황</div>
    <div id="cntSelect" class="text-lg font-black text-gray-900 mt-0.5">0건</div>
  </div>
  <div id="cntBoxVisitWait" class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm text-center cursor-pointer hover:border-theme transition">
    <div class="text-[11px] text-gray-500 font-bold">예약 대기</div>
    <div id="cntVisitWait" class="text-lg font-black text-gray-500 mt-0.5">0건</div>
  </div>
  <div id="cntBoxVisitPlan" class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm text-center cursor-pointer hover:border-theme transition">
    <div class="text-[11px] text-orange-500 font-bold">방문 예정</div>
    <div id="cntVisitPlan" class="text-lg font-black text-orange-500 mt-0.5">0건</div>
  </div>
  <div id="cntBoxSubmitWait" class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm text-center cursor-pointer hover:border-theme transition">
    <div class="text-[11px] text-gray-500 font-bold">미제출</div>
    <div id="cntSubmitWait" class="text-lg font-black text-gray-500 mt-0.5">0건</div>
  </div>
  <div id="cntBoxSubmitDone" class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm text-center col-span-2 md:col-span-1 cursor-pointer hover:border-theme transition">
    <div class="text-[11px] text-emerald-600 font-bold">제출 완료</div>
    <div id="cntSubmitDone" class="text-lg font-black text-emerald-600 mt-0.5">0건</div>
  </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-4 flex-1 overflow-hidden">
  <div class="lg:col-span-2 bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between overflow-hidden">
    <div class="flex justify-between items-center mb-0.5 shrink-0">
      <h3 class="font-bold text-gray-800 text-xs">월별 일정 달력</h3>
      <div class="flex items-center gap-3 text-[11px] font-semibold">
        <span class="flex items-center gap-1 text-emerald-600"><span class="text-[9px]">🟢</span> 방문</span>
        <span class="flex items-center gap-1 text-rose-500"><span class="text-[9px]">🔴</span> 마감</span>
      </div>
    </div>
    <div id="calendarGrid" class="grid grid-cols-7 gap-1 flex-1 overflow-hidden"></div>
  </div>

  <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex flex-col overflow-hidden">
    <h3 class="font-bold text-gray-800 text-xs mb-1.5 shrink-0">방문 일정</h3>
    <div id="scheduledVisitList" class="space-y-1.5 widget-scroll pr-1 flex-1"></div>
  </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4 h-48 shrink-0">
  <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex flex-col overflow-hidden">
    <h3 class="font-bold text-gray-800 text-xs mb-1.5 shrink-0">제출 마감 임박</h3>
    <div id="upcomingList" class="space-y-1.5 widget-scroll pr-1 flex-1"></div>
  </div>

  <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex flex-col overflow-hidden">
    <h3 class="font-bold text-gray-800 text-xs mb-1.5 shrink-0">예약 대기</h3>
    <div id="unscheduledVisitList" class="space-y-1.5 widget-scroll pr-1 flex-1"></div>
  </div>
</div>
