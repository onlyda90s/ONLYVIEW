<div class="flex items-center h-10 shrink-0">
  <div class="flex items-center gap-1.5">
    <h2 class="text-2xl font-black text-theme">체험단 목록</h2>
    <div class="relative group cursor-pointer">
      <span class="w-5 h-5 rounded-full bg-gray-100 text-gray-400 group-hover:bg-theme group-hover:text-white flex items-center justify-center text-xs font-bold transition shadow-sm">?</span>
      <div class="absolute left-0 top-7 hidden group-hover:block z-30 w-96 p-4 bg-white border border-gray-100 rounded-2xl shadow-xl space-y-2.5 text-xs">
        <div class="font-bold text-gray-800 border-b pb-2 flex items-center gap-1">
          <span>💡</span> 체험단 진행 상태 가이드
        </div>
        <div class="space-y-2 text-gray-600 text-[11px] leading-relaxed">
          <div>• <b class="text-gray-900">선정</b>: 방문 날짜를 정하기 전을 포함한 전체 당첨 내역이에요.</div>
          <div>• <b class="text-gray-900">방문</b>: 방문 일정을 예약했거나 이미 방문을 마친 상태예요.</div>
          <div>• <b class="text-gray-900">미제출</b>: 방문을 다녀왔거나 일시가 지났는데 아직 리뷰를 작성하지 않은 상태예요.</div>
          <div>• <b class="text-gray-900">제출</b>: 포스팅 작성과 리뷰 제출까지 모두 끝난 마감 상태예요.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="flex items-center justify-end gap-2 shrink-0 flex-wrap">
  <div class="flex bg-gray-100 p-1 rounded-xl gap-1">
    <button id="subTabOngoing" class="flex-1 w-28 text-center py-1.5 rounded-lg font-bold text-xs bg-theme text-white shadow-sm transition">진행중인 체험</button>
    <button id="subTabSubmitted" class="flex-1 w-28 text-center py-1.5 rounded-lg font-bold text-xs bg-transparent text-gray-600 hover:bg-gray-200 transition">완료된 체험</button>
  </div>

  <input type="text" id="searchInput" placeholder="업체명 / 사이트 검색..." class="border p-2 rounded-xl text-xs w-64 outline-none focus:ring-2 ring-theme bg-white shadow-sm">
  <select id="filterYear" class="border p-2 rounded-xl text-xs bg-white outline-none focus:ring-2 ring-theme shadow-sm"></select>
  <select id="filterMonth" class="border p-2 rounded-xl text-xs bg-white outline-none focus:ring-2 ring-theme shadow-sm">
    <option value="ALL">월 전체</option>
    <option value="1">1월</option>
    <option value="2">2월</option>
    <option value="3">3월</option>
    <option value="4">4월</option>
    <option value="5">5월</option>
    <option value="6">6월</option>
    <option value="7">7월</option>
    <option value="8">8월</option>
    <option value="9">9월</option>
    <option value="10">10월</option>
    <option value="11">11월</option>
    <option value="12">12월</option>
  </select>
  <select id="filterStatus" class="border p-2 rounded-xl text-xs bg-white outline-none focus:ring-2 ring-theme shadow-sm">
    <option value="ALL">상태 전체</option>
    <option value="신청">신청</option>
    <option value="선정">선정</option>
    <option value="방문">방문</option>
    <option value="미제출">미제출</option>
    <option value="제출">제출/완료</option>
    <option value="배송">배송</option>
    <option value="원고료">원고료</option>
  </select>

  <button id="saveBatchBtn" class="hidden px-3.5 py-1.5 rounded-lg font-bold text-xs bg-emerald-600 text-white shadow-sm transition hover:bg-emerald-700 ml-3">전체 저장</button>
  <button id="batchEditBtn" class="px-4 py-1.5 rounded-lg font-bold text-xs bg-theme text-white shadow-sm transition hover:bg-theme-hover ml-3">수정</button>
</div>

<div class="hidden md:block bg-white rounded-2xl shadow-sm border border-gray-100 overflow-x-auto">
  <table class="w-full text-left border-collapse">
    <thead class="bg-gray-50 border-b border-gray-100 text-gray-400 text-xs">
      <tr>
        <th class="sort-header p-3 cursor-pointer hover:bg-gray-100 transition select-none" data-col="storeName">매장명 ↕</th>
        <th class="sort-header p-3 cursor-pointer hover:bg-gray-100 transition select-none" data-col="status">상태 ↕</th>
        <th class="sort-header p-3 cursor-pointer hover:bg-gray-100 transition select-none" data-col="platformName">사이트 ↕</th>
        <th class="sort-header p-3 cursor-pointer hover:bg-gray-100 transition select-none" data-col="visitDate">방문일/시간 ↕</th>
        <th class="sort-header p-3 cursor-pointer hover:bg-gray-100 transition select-none" data-col="deadlineDate">마감일 ↕</th>
        <th class="sort-header p-3 cursor-pointer hover:bg-gray-100 transition select-none" data-col="sponsoredAmount">제공금액 ↕</th>
        <th class="sort-header p-3 cursor-pointer hover:bg-gray-100 transition select-none" data-col="paidAmount">결제금액 ↕</th>
        <th class="sort-header p-3 cursor-pointer hover:bg-gray-100 transition select-none" data-col="revenue">실수익 ↕</th>
        <th class="p-3">비고</th>
      </tr>
    </thead>
    <tbody id="campaignTableBody"></tbody>
  </table>
</div>

<div id="campaignCardList" class="block md:hidden space-y-3"></div>
