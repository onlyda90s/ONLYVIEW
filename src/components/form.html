<div class="flex items-center h-10 mb-4 shrink-0"> 
  <h2 class="text-2xl font-black text-theme">체험단 등록</h2>
</div>

<div id="formContainer" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-5">
  <form id="campaignForm" class="space-y-4 text-sm">
    <div class="space-y-1.5">
      <label class="block text-xs font-bold text-gray-900">진행 상태</label>
      <div class="flex gap-1.5">
        <button type="button" id="btnStatus_신청" class="btn-status py-1.5 px-3.5 rounded-lg font-bold border border-theme bg-theme text-white text-xs transition shadow-sm">신청</button>
        <button type="button" id="btnStatus_선정" class="btn-status py-1.5 px-3.5 rounded-lg font-bold border border-gray-200 bg-white text-gray-600 text-xs hover:border-gray-300 transition">선정</button>
        <button type="button" id="btnStatus_배송" class="btn-status py-1.5 px-3.5 rounded-lg font-bold border border-gray-200 bg-white text-gray-600 text-xs hover:border-gray-300 transition">배송</button>
        <button type="button" id="btnStatus_원고료" class="btn-status py-1.5 px-3.5 rounded-lg font-bold border border-gray-200 bg-white text-gray-600 text-xs hover:border-gray-300 transition">원고료</button>
      </div>
    </div>

    <div class="space-y-1.5">
      <label class="block text-xs font-bold text-gray-900">체험단 사이트</label>
      <div id="platformChipsContainer" class="flex flex-wrap gap-1.5"></div>
      <input type="hidden" id="platformName" value="개별">
    </div>

    <div>
      <label id="storeNameLabel" class="block text-xs font-bold text-gray-900 mb-1">매장명 (업체명) *</label>
      <input type="text" id="storeName" placeholder="예: 아서원1920 전주본점" required class="w-full border border-gray-200 p-2.5 rounded-xl outline-none focus:ring-2 ring-theme text-sm">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <div>
        <label id="sponsoredAmountLabel" class="block text-xs font-bold text-gray-900 mb-1">제공금액 (원)</label>
        <input type="text" id="sponsoredAmount" placeholder="0" class="w-full border border-gray-200 p-2.5 rounded-xl outline-none focus:ring-2 ring-theme text-sm">
      </div>
      <div id="rowApplyDate">
        <label class="block text-xs font-bold text-gray-900 mb-1">신청일 (자동 세팅)</label>
        <input type="date" id="applyDate" max="2099-12-31" class="w-full border border-gray-200 p-2.5 rounded-xl text-xs bg-gray-50 text-gray-600 outline-none">
      </div>
      <div id="rowDeadlineDate" class="hidden">
        <label class="block text-xs font-bold text-rose-600 mb-1">포스팅 마감일</label>
        <input type="date" id="deadlineDate" max="2099-12-31" class="w-full border border-gray-200 p-2.5 rounded-xl text-xs bg-white outline-none focus:ring-2 ring-theme">
      </div>
    </div>

    <div id="rowVisit" class="hidden grid grid-cols-1 md:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-bold text-gray-900 mb-1">방문예정일 (시간 포함)</label>
        <div class="flex gap-1.5">
          <input type="date" id="visitDate" max="2099-12-31" class="w-full border border-gray-200 p-2.5 rounded-xl text-xs bg-white outline-none focus:ring-2 ring-theme">
          <input type="time" id="visitTime" class="w-28 border border-gray-200 p-2.5 rounded-xl text-xs bg-white outline-none focus:ring-2 ring-theme">
        </div>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-900 mb-1">동반인원 (멤버 이름)</label>
        <input type="text" id="companions" placeholder="예: 남편, 친구2명" class="w-full border border-gray-200 p-2.5 rounded-xl outline-none focus:ring-2 ring-theme text-sm">
      </div>
    </div>

    <div id="rowFinancial" class="hidden grid grid-cols-1 md:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-bold text-gray-900 mb-1">결제금액 (원)</label>
        <input type="text" id="paidAmount" placeholder="0" class="w-full border border-gray-200 p-2.5 rounded-xl outline-none focus:ring-2 ring-theme text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-900 mb-1">실수익 (원)</label>
        <input type="text" id="revenue" placeholder="0" class="w-full border border-gray-200 p-2.5 rounded-xl outline-none focus:ring-2 ring-theme text-sm">
      </div>
    </div>

    <div id="rowContact" class="hidden">
      <label class="block text-xs font-bold text-gray-900 mb-1">업체 연락처</label>
      <input type="text" id="contact" placeholder="010-0000-0000" class="w-full border border-gray-200 p-2.5 rounded-xl outline-none focus:ring-2 ring-theme text-sm">
    </div>

    <div id="rowMemo" class="hidden">
      <label class="block text-xs font-bold text-gray-900 mb-1">메모</label>
      <textarea id="memo" rows="2" placeholder="참고사항 입력..." class="w-full border border-gray-200 p-2.5 rounded-xl outline-none focus:ring-2 ring-theme text-sm resize-none"></textarea>
    </div>

    <div class="flex justify-end pt-3 border-t border-gray-100">
      <button id="submitBtn" type="submit" class="w-full bg-theme bg-theme-hover text-white font-bold py-3.5 px-8 rounded-xl transition shadow-sm text-sm">
        등록하기
      </button>
    </div>
  </form>
</div>
