<div class="flex items-center h-10 mb-4 shrink-0"> 
  <h2 class="text-2xl font-black text-theme">설정 및 공유</h2>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
  <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
    <h3 class="font-bold text-gray-800 text-base">마감 임박 알림 기준 설정</h3>
    <div class="flex items-center gap-2">
      <span class="text-xs text-gray-600 font-medium mr-2">D-Day 범위:</span>
      <button id="btnDeadlineDay_7" class="btn-deadline-day py-1.5 px-3.5 rounded-lg font-bold border border-theme bg-theme text-white text-xs transition shadow-sm" data-days="7">7일 전</button>
      <button id="btnDeadlineDay_10" class="btn-deadline-day py-1.5 px-3.5 rounded-lg font-bold border border-gray-200 bg-white text-gray-600 text-xs hover:border-gray-300 transition" data-days="10">10일 전</button>
      <button id="btnDeadlineDay_14" class="btn-deadline-day py-1.5 px-3.5 rounded-lg font-bold border border-gray-200 bg-white text-gray-600 text-xs hover:border-gray-300 transition" data-days="14">14일 전</button>
    </div>
  </div>

  <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
    <h3 class="font-bold text-gray-800 text-base">테마 색상 설정</h3>
    <div class="flex items-center gap-3">
      <button class="btn-theme-color w-8 h-8 rounded-full bg-[#E63946] border-2 border-white shadow-md hover:scale-110 transition" data-color="red" title="빨강"></button>
      <button class="btn-theme-color w-8 h-8 rounded-full bg-[#F4A261] border-2 border-white shadow-md hover:scale-110 transition" data-color="orange" title="주황"></button>
      <button class="btn-theme-color w-8 h-8 rounded-full bg-[#E9C46A] border-2 border-white shadow-md hover:scale-110 transition" data-color="yellow" title="노랑"></button>
      <button class="btn-theme-color w-8 h-8 rounded-full bg-[#2A9D8F] border-2 border-white shadow-md hover:scale-110 transition" data-color="green" title="초록"></button>
      <button class="btn-theme-color w-8 h-8 rounded-full bg-[#457B9D] border-2 border-white shadow-md hover:scale-110 transition" data-color="blue" title="파랑"></button>
      <button class="btn-theme-color w-8 h-8 rounded-full bg-[#9D4EDD] border-2 border-white shadow-md hover:scale-110 transition" data-color="purple" title="보라"></button>
      <button class="btn-theme-color w-8 h-8 rounded-full bg-[#2B2D42] border-2 border-white shadow-md hover:scale-110 transition" data-color="black" title="검정"></button>
    </div>
  </div>

  <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
    <h3 class="font-bold text-gray-800 text-base">공유 코드 관리</h3>
    <div class="p-4 bg-theme-light rounded-2xl flex items-center justify-between border border-theme/10">
      <div>
        <div class="text-xs text-gray-500 font-semibold">내 초대 코드</div>
        <div id="myShareCode" class="text-xl font-mono font-black text-theme"></div>
      </div>
      <button id="editCodeBtn" class="bg-white border text-gray-700 text-xs px-3 py-2 rounded-xl font-bold hover:bg-gray-50">코드 변경 (4/6자리)</button>
    </div>
  </div>

  <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
    <h3 class="font-bold text-gray-800 text-base">동반자 내역 조회 (읽기 전용)</h3>
    <div class="flex gap-2">
      <input type="text" id="partnerCodeInput" placeholder="동반자 코드 입력" class="border p-2.5 rounded-xl text-xs w-full outline-none focus:ring-2 ring-theme">
      <button id="applyPartnerCodeBtn" class="bg-gray-800 text-white text-xs px-4 py-2.5 rounded-xl font-bold shrink-0">조회</button>
    </div>
  </div>
</div>

<div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
  <h3 class="font-bold text-gray-800 text-base">상태별 글자 색상 선택 (동그라미 클릭 시 팔레트 변경)</h3>
  <div class="grid grid-cols-2 md:grid-cols-7 gap-3 text-xs">
    <div class="p-3 bg-gray-50 rounded-xl border border-gray-100 text-center space-y-2">
      <span class="block font-bold text-gray-700">신청</span>
      <button type="button" class="btn-color-picker w-8 h-8 rounded-full border-2 border-white shadow-md inline-block transition hover:scale-110" id="picker_badge_apply" data-key="apply" data-label="신청"></button>
    </div>
    <div class="p-3 bg-gray-50 rounded-xl border border-gray-100 text-center space-y-2">
      <span class="block font-bold text-gray-700">선정</span>
      <button type="button" class="btn-color-picker w-8 h-8 rounded-full border-2 border-white shadow-md inline-block transition hover:scale-110" id="picker_badge_select" data-key="select" data-label="선정"></button>
    </div>
    <div class="p-3 bg-gray-50 rounded-xl border border-gray-100 text-center space-y-2">
      <span class="block font-bold text-gray-700">방문</span>
      <button type="button" class="btn-color-picker w-8 h-8 rounded-full border-2 border-white shadow-md inline-block transition hover:scale-110" id="picker_badge_visit" data-key="visit" data-label="방문"></button>
    </div>
    <div class="p-3 bg-gray-50 rounded-xl border border-gray-100 text-center space-y-2">
      <span class="block font-bold text-gray-700">미제출</span>
      <button type="button" class="btn-color-picker w-8 h-8 rounded-full border-2 border-white shadow-md inline-block transition hover:scale-110" id="picker_badge_unsubmitted" data-key="unsubmitted" data-label="미제출"></button>
    </div>
    <div class="p-3 bg-gray-50 rounded-xl border border-gray-100 text-center space-y-2">
      <span class="block font-bold text-gray-700">제출</span>
      <button type="button" class="btn-color-picker w-8 h-8 rounded-full border-2 border-white shadow-md inline-block transition hover:scale-110" id="picker_badge_submit" data-key="submit" data-label="제출"></button>
    </div>
    <div class="p-3 bg-gray-50 rounded-xl border border-gray-100 text-center space-y-2">
      <span class="block font-bold text-gray-700">배송</span>
      <button type="button" class="btn-color-picker w-8 h-8 rounded-full border-2 border-white shadow-md inline-block transition hover:scale-110" id="picker_badge_delivery" data-key="delivery" data-label="배송"></button>
    </div>
    <div class="p-3 bg-gray-50 rounded-xl border border-gray-100 text-center space-y-2">
      <span class="block font-bold text-gray-700">원고료</span>
      <button type="button" class="btn-color-picker w-8 h-8 rounded-full border-2 border-white shadow-md inline-block transition hover:scale-110" id="picker_badge_fee" data-key="fee" data-label="원고료"></button>
    </div>
  </div>
</div>
